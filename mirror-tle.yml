name: Mirror amateur TLEs

# Fetches the amateur-satellite TLE set on a schedule, from GitHub's servers
# (not your home or school IP), validates it, and commits it to this repo so
# Satchron can pull it as often as it likes without ever touching CelesTrak.
#
# Setup:
#   1. Put this file at   .github/workflows/mirror-tle.yml   in a PUBLIC repo.
#   2. Edit the <USER>/<REPO> in the User-Agent line below to your repo (cosmetic
#      courtesy to the upstream servers; not required for it to work).
#   3. Commit. Then open the Actions tab and press "Run workflow" once to seed
#      amateur.txt immediately instead of waiting for the first scheduled run.
#   4. Point Satchron's TLE_URL at:
#      https://raw.githubusercontent.com/<USER>/<REPO>/main/amateur.txt

on:
  schedule:
    # Daily at 09:23 UTC (02:23 Phoenix). One polite request per day.
    # For every 48 hours instead, use:  "23 9 */2 * *"
    - cron: "23 9 * * *"
  workflow_dispatch:   # adds a manual "Run workflow" button for seeding/testing

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Fetch TLEs (CelesTrak primary, AMSAT fallback)
        run: |
          set -e
          UA="Satchron-mirror/1.0 (+https://github.com/<USER>/<REPO>; fetches once per day)"
          CELESTRAK="https://celestrak.org/NORAD/elements/gp.php?GROUP=amateur&FORMAT=tle"
          AMSAT="https://www.amsat.org/tle/current/nasabare.txt"
          get() { curl -fsSL --max-time 40 -A "$UA" "$1" -o new.txt; }

          if get "$CELESTRAK"; then
            echo "source: CelesTrak"
          elif get "$AMSAT"; then
            echo "source: AMSAT (CelesTrak refused this runner)"
          else
            echo "both sources failed; keeping the last good file"
            exit 1
          fi

          # Validate before trusting it. A 403 or HTML error page has no TLE
          # records, so counting line-1 records rejects garbage before it can
          # overwrite a known-good mirror.
          records=$(grep -c '^1 ' new.txt || true)
          echo "TLE line-1 records found: $records"
          if [ "${records:-0}" -lt 10 ]; then
            echo "too few records; refusing to overwrite the mirror"
            exit 1
          fi

          mv new.txt amateur.txt

      - name: Commit if the file changed
        run: |
          git config user.name  "satchron-mirror"
          git config user.email "actions@users.noreply.github.com"
          git add amateur.txt
          if git diff --cached --quiet; then
            echo "no change since last run"
          else
            git commit -m "amateur TLEs $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
